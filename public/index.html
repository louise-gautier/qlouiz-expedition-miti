<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MITIQLOUIZ EXPÉDITION 33 2026</title>
    <style>
        :root {
            --primary-color: #004a99; /* Bleu Mitiq */
            --secondary-color: #ffd700; /* Jaune Expédition 33 */
            --text-color: #333;
            --bg-color: #f4f7f6;
            --card-bg: #fff;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 800px;
        }

        /* Style mis à jour pour le header avec l'image */
        header h1 {
            margin: 0;
            padding: 0;
        }

        header h1 img {
            max-width: 100%; /* S'adapte à la largeur du header */
            height: auto;    /* Conserve les proportions */
            display: block;  /* Évite les espaces sous l'image */
            margin: 0 auto;  /* Centre l'image si elle est plus petite que le header */
        }

        #p-count {
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: bold;
            margin-top: 10px;
        }

        #p-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 800px;
        }

        .p-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 10px;
            text-align: center;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .p-card:hover {
            transform: translateY(-5px);
        }

        .p-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 8px;
            border: 3px solid var(--secondary-color);
        }

        .p-card .p-init {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
        }
    </style>
</head>
